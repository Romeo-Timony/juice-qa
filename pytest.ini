[pytest]
addopts = -v -s --browser chromium --alluredir=allure-results
testpaths = tests
pythonpath = .
markers =
    qase: Qase TMS test case ID mapping
    unit: Framework self-testing unit test cases (<10ms, no network)
    api: Backend API domain test cases
    ui: Frontend Playwright UI component test cases
    e2e: End-to-End full user journey test cases
    security: Security and pentesting test cases

# Live CLI Logging (Best Practice: мгновенная видимость логов в консоли)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
