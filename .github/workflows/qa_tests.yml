name: QA Automation Tests

on:
  push:
    branches:
      - master
      - main
      - 'qa/*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira Issue Key'
        required: false
        default: 'JS-40'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    env:
      JUICE_SHOP_LOCAL_URL: http://localhost:3000

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Java for Allure Report Generator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies & Allure CLI
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium
        npm install -g allure-commandline --loglevel=error

    - name: Wait for Juice Shop
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:3000/rest/admin/application-version > /dev/null; then
            echo "Juice Shop is up"; exit 0
          fi
          sleep 2
        done
        echo "Juice Shop did not start in time"; exit 1

    - name: Run Backend API Tests
      continue-on-error: true
      id: backend_tests
      run: |
        set -o pipefail
        if compgen -G "tests/backend/test_*.py" > /dev/null; then
          pytest tests/backend/ --alluredir=allure-results 2>&1 | tee backend.log
        else
          echo "No backend tests to run, skipping." | tee backend.log
          exit 0
        fi

    - name: Run Frontend UI Tests
      continue-on-error: true
      id: frontend_tests
      run: |
        set -o pipefail
        if compgen -G "tests/frontend/test_*.py" > /dev/null; then
          pytest tests/frontend/ --alluredir=allure-results 2>&1 | tee frontend.log
        else
          echo "No frontend tests to run, skipping." | tee frontend.log
          exit 0
        fi

    - name: Compile Interactive Allure HTML Report
      if: always()
      run: |
        allure generate allure-results -o allure-report --clean

    - name: Upload Raw Allure Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results
        retention-days: 14

    - name: Upload Allure HTML Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-html-report
        path: allure-report
        retention-days: 14

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./allure-report

    - name: Get Issue Key from Branch
      id: extract_key
      if: always()
      run: |
        # Extract JS-XX from qa/js-xx
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        ISSUE_KEY=$(echo "$BRANCH_NAME" | grep -o -E 'qa/js-[0-9]+' | sed 's/qa\///' | tr 'a-z' 'A-Z')
        if [ -z "$ISSUE_KEY" ]; then ISSUE_KEY="JS-UNKNOWN"; fi
        echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT

    - name: Send Report to n8n Webhook
      if: always()
      run: |
        if [ "${{ steps.backend_tests.outcome }}" == "success" ] && [ "${{ steps.frontend_tests.outcome }}" == "success" ]; then
          STATUS="success"
        else
          STATUS="failed"
        fi

        ISSUE_KEY="${{ steps.extract_key.outputs.issue_key }}"
        if [ "$ISSUE_KEY" == "JS-UNKNOWN" ]; then
          echo "Issue key could not be determined from branch, skipping webhook notification."
          exit 0
        fi

        BACKEND_SUMMARY=$(grep -E '^=+ .* in [0-9.]+s' backend.log 2>/dev/null | tail -n1 | tr -d '=' | xargs)
        FRONTEND_SUMMARY=$(grep -E '^=+ .* in [0-9.]+s' frontend.log 2>/dev/null | tail -n1 | tr -d '=' | xargs)
        SUMMARY="Backend: ${BACKEND_SUMMARY:-пропущено}; Frontend: ${FRONTEND_SUMMARY:-нет данных}"

        if [ -f "allure-report/widgets/summary.json" ]; then
          PASSED_COUNT=$(jq -r '.statistic.passed // 0' allure-report/widgets/summary.json 2>/dev/null || echo "0")
          TOTAL_COUNT=$(jq -r '.statistic.total // 0' allure-report/widgets/summary.json 2>/dev/null || echo "0")
          if [ "$TOTAL_COUNT" -gt 0 ]; then
            SUMMARY="${SUMMARY} (Allure: ${PASSED_COUNT}/${TOTAL_COUNT} тестов со всеми шагами и артефактами)"
          fi
        fi

        PAYLOAD=$(jq -n \
          --arg issueKey "$ISSUE_KEY" \
          --arg status "$STATUS" \
          --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --arg allureSummary "$SUMMARY" \
          '{issueKey: $issueKey, status: $status, runUrl: $runUrl, allureSummary: $allureSummary}')

        echo "Sending report to n8n webhook via HTTPS (ngrok)..."
        HTTP_CODE=$(curl -s -o response.txt -w '%{http_code}' -X POST \
          "https://stylish-mary-bluebelled.ngrok-free.dev/webhook/github-actions-report" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")
        echo "n8n response ($HTTP_CODE): $(cat response.txt)"
        if [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" -eq 000 ]; then
          echo "Fallback sending directly to n8n IP..."
          curl -s -X POST "http://201.34.147.33:5678/webhook/github-actions-report" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
        fi
