name: QA Automation Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest playwright requests pytest-playwright
        playwright install chromium

    - name: Run Backend API Tests
      run: |
        if [ -d "qa-automation/tests/backend" ]; then
          pytest qa-automation/tests/backend/ -v
        else
          echo "Backend tests folder not found, skipping."
        fi

    - name: Run Frontend UI Tests
      run: |
        if [ -d "qa-automation/tests/frontend" ]; then
          pytest qa-automation/tests/frontend/ -v
        else
          echo "Frontend tests folder not found, skipping."
        fi
