name: QA Automation Tests

on:
  push:
    branches:
      - master
      - main
      - 'qa/*'
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    env:
      JUICE_SHOP_LOCAL_URL: http://localhost:3000

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Wait for Juice Shop
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:3000/rest/admin/application-version > /dev/null; then
            echo "Juice Shop is up"; exit 0
          fi
          sleep 2
        done
        echo "Juice Shop did not start in time"; exit 1

    - name: Run Backend API Tests
      continue-on-error: true
      id: backend_tests
      run: |
        set -o pipefail
        if [ -d "tests/backend" ]; then
          pytest tests/backend/ --alluredir=allure-results 2>&1 | tee backend.log
        else
          echo "Backend tests folder not found, skipping." | tee backend.log
        fi

    - name: Run Frontend UI Tests
      continue-on-error: true
      id: frontend_tests
      run: |
        set -o pipefail
        if [ -d "tests/frontend" ]; then
          pytest tests/frontend/ --alluredir=allure-results 2>&1 | tee frontend.log
        else
          echo "Frontend tests folder not found, skipping." | tee frontend.log
        fi

    - name: Get Issue Key from Branch
      id: extract_key
      run: |
        # Extract JS-XX from qa/js-xx
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        ISSUE_KEY=$(echo "$BRANCH_NAME" | grep -o -E 'qa/js-[0-9]+' | sed 's/qa\///' | tr 'a-z' 'A-Z')
        if [ -z "$ISSUE_KEY" ]; then ISSUE_KEY="JS-UNKNOWN"; fi
        echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT

    - name: Send Report to n8n Webhook
      if: always()
      run: |
        if [ "${{ steps.backend_tests.outcome }}" == "success" ] && [ "${{ steps.frontend_tests.outcome }}" == "success" ]; then
          STATUS="success"
        else
          STATUS="failed"
        fi

        EXEC_ID=""
        RESUME_TOKEN=""
        if [ -f "n8n_execution.json" ]; then
          EXEC_ID=$(jq -r '.executionId // empty' n8n_execution.json)
          RESUME_TOKEN=$(jq -r '.resumeToken // empty' n8n_execution.json)
        fi

        ISSUE_KEY="${{ steps.extract_key.outputs.issue_key }}"
        if [ "$ISSUE_KEY" == "JS-UNKNOWN" ]; then
          echo "Issue key could not be determined from branch, skipping webhook notification."
          exit 0
        fi
        if [ -z "$EXEC_ID" ] || [ -z "$RESUME_TOKEN" ]; then
          echo "n8n executionId/resumeToken not found in n8n_execution.json, skipping webhook notification."
          exit 0
        fi

        BACKEND_SUMMARY=$(grep -E '^=+ .* in [0-9.]+s' backend.log 2>/dev/null | tail -n1 | tr -d '=' | xargs)
        FRONTEND_SUMMARY=$(grep -E '^=+ .* in [0-9.]+s' frontend.log 2>/dev/null | tail -n1 | tr -d '=' | xargs)
        SUMMARY="Backend: ${BACKEND_SUMMARY:-нет данных}; Frontend: ${FRONTEND_SUMMARY:-нет данных}"

        PAYLOAD=$(jq -n \
          --arg issueKey "$ISSUE_KEY" \
          --arg status "$STATUS" \
          --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --arg allureSummary "$SUMMARY" \
          '{issueKey: $issueKey, status: $status, runUrl: $runUrl, allureSummary: $allureSummary}')

        echo "Sending report to n8n execution $EXEC_ID..."
        HTTP_CODE=$(curl -s -o response.txt -w '%{http_code}' -X POST \
          "http://201.34.147.33:5678/webhook-waiting/$EXEC_ID/github-actions-report?signature=$RESUME_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")
        echo "n8n responded with HTTP $HTTP_CODE: $(cat response.txt)"
        if [ "$HTTP_CODE" -ge 400 ]; then
          echo "::error::n8n webhook rejected the report (HTTP $HTTP_CODE)"
          exit 1
        fi

    - name: Upload Allure Results as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results
