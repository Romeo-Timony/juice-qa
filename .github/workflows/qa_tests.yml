name: QA Automation Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest playwright requests pytest-playwright allure-pytest
        playwright install chromium

    - name: Run Backend API Tests
      continue-on-error: true
      id: backend_tests
      run: |
        if [ -d "tests/backend" ]; then
          pytest tests/backend/ -v --alluredir=allure-results
        else
          echo "Backend tests folder not found, skipping."
        fi

    - name: Run Frontend UI Tests
      continue-on-error: true
      id: frontend_tests
      run: |
        if [ -d "tests/frontend" ]; then
          pytest tests/frontend/ -v --alluredir=allure-results
        else
          echo "Frontend tests folder not found, skipping."
        fi

    - name: Get Issue Key from Branch
      id: extract_key
      run: |
        # Extract JS-XX from qa/js-xx
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        ISSUE_KEY=$(echo "$BRANCH_NAME" | grep -o -E 'qa/js-[0-9]+' | sed 's/qa\///' | tr 'a-z' 'A-Z')
        if [ -z "$ISSUE_KEY" ]; then ISSUE_KEY="JS-UNKNOWN"; fi
        echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT

    - name: Send Report to n8n Webhook
      if: always()
      run: |
        # Check overall status
        if [ "${{ steps.backend_tests.outcome }}" == "success" ] && [ "${{ steps.frontend_tests.outcome }}" == "success" ]; then
          STATUS="success"
        else
          STATUS="failed"
        fi
        
        # Read execution ID
        EXEC_ID=""
        if [ -f "n8n_execution.json" ]; then
          EXEC_ID=$(cat n8n_execution.json | jq -r '.executionId')
        fi
        
        if [ -n "$EXEC_ID" ]; then
          echo "Sending report to n8n execution $EXEC_ID..."
          curl -X POST http://201.34.147.33:5678/webhook-waiting/$EXEC_ID/github-actions-report \
            -H "Content-Type: application/json" \
            -d "{\"issueKey\": \"${{ steps.extract_key.outputs.issue_key }}\", \"status\": \"$STATUS\", \"runUrl\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\", \"allureSummary\": \"Тесты завершены (см. артефакты GitHub Actions)\"}"
        else
          echo "No n8n execution ID found, skipping webhook notification."
        fi

    - name: Upload Allure Results as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results
